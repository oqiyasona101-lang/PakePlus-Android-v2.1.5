<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周易彩票号码推荐系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .date-info {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 18px;
    }

    .game-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .game-btn {
      padding: 12px 20px;
      background: #4a6fc5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }

    .game-btn:hover {
      background: #5a7fd5;
      transform: translateY(-3px);
    }

    .game-btn.active {
      background: #ff6b6b;
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
    }

    .result-container {
      margin-top: 25px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .recommended-numbers {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 20px 0;
    }

    .number-group {
      text-align: center;
      width: 100%;
    }

    .group-title {
      margin-bottom: 10px;
      font-weight: bold;
      color: #ffd700;
      font-size: 18px;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .number {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4a6fc5;
      border-radius: 50%;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .number.blue {
      background: #3498db;
    }

    .number.red {
      background: #e74c3c;
    }

    .explanation {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      border-left: 4px solid #ffd700;
      border-radius: 5px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      h1 {
        font-size: 22px;
      }

      .game-selector {
        flex-direction: column;
        align-items: center;
      }

      .game-btn {
        width: 100%;
        max-width: 300px;
      }

      .number {
        width: 35px;
        height: 35px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>周易彩票号码推荐系统</h1>
    <div class="date-info">
      <div>当前日期：<span id="current-date"></span></div>
      <div>天干地支：<span id="gan-zhi"></span></div>
    </div>
    <div class="game-selector">
      <button class="game-btn" data-game="daletou">大乐透</button>
      <button class="game-btn" data-game="shuangseqiu">双色球</button>
      <button class="game-btn" data-game="kuaile8">快乐8</button>
    </div>
    <div class="result-container" id="result-container" style="display: none;">
      <h3>推荐号码</h3>
      <div class="recommended-numbers" id="recommended-numbers"></div>
      <div class="explanation" id="explanation"></div>
    </div>
  </div>

  <script>
    // 天干地支映射
    const heavenlyStems = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    const earthlyBranches = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    
    // 八卦映射
    const bagua = {
      1: '乾', 2: '兑', 3: '离', 4: '震',
      5: '巽', 6: '坎', 7: '艮', 8: '坤'
    };
    
    // 获取当前日期的天干地支
    function getGanZhi() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      
      // 简化计算，实际应使用更精确的算法
      const yearGanZhi = (year - 4) % 10;
      const yearZhi = (year - 4) % 12;
      
      document.getElementById('current-date').textContent = `${year}年${month}月${day}日`;
      document.getElementById('gan-zhi').textContent = `${heavenlyStems[yearGanZhi]}${earthlyBranches[yearZhi]}年`;
      
      return { gan: yearGanZhi, zhi: yearZhi };
    }
    
    // 模拟蒙特卡罗方法生成号码
    function simulateNumbers(gameType, count) {
      const results = [];
      let redMax, blueMax, redCount, blueCount;
      
      switch(gameType) {
        case 'daletou':
          redMax = 35;
          blueMax = 12;
          redCount = 5;
          blueCount = 2;
          break;
        case 'shuangseqiu':
          redMax = 33;
          blueMax = 16;
          redCount = 6;
          blueCount = 1;
          break;
        case 'kuaile8':
          redMax = 80;
          redCount = 10; // 修改为至少10个号码
          blueCount = 0;
          break;
      }
      
      for (let i = 0; i < count; i++) {
        const redBalls = [];
        const blueBalls = [];
        
        // 生成红球
        while (redBalls.length < redCount) {
          const num = Math.floor(Math.random() * redMax) + 1;
          if (!redBalls.includes(num)) {
            redBalls.push(num);
          }
        }
        redBalls.sort((a, b) => a - b);
        
        // 生成蓝球
        if (blueCount > 0) {
          while (blueBalls.length < blueCount) {
            const num = Math.floor(Math.random() * blueMax) + 1;
            if (!blueBalls.includes(num)) {
              blueBalls.push(num);
            }
          }
          blueBalls.sort((a, b) => a - b);
        }
        
        results.push({ red: redBalls, blue: blueBalls });
      }
      
      return results;
    }
    
    // 统计号码出现频率
    function countFrequency(results) {
      const redFreq = {};
      const blueFreq = {};
      
      results.forEach(result => {
        result.red.forEach(num => {
          redFreq[num] = (redFreq[num] || 0) + 1;
        });
        
        result.blue.forEach(num => {
          blueFreq[num] = (blueFreq[num] || 0) + 1;
        });
      });
      
      return { red: redFreq, blue: blueFreq };
    }
    
    // 获取出现频率最高的号码
    function getTopNumbers(freq, count) {
      const entries = Object.entries(freq).map(([num, freq]) => [parseInt(num), freq]);
      entries.sort((a, b) => b[1] - a[1]);
      return entries.slice(0, count).map(item => item[0]).sort((a, b) => a - b);
    }
    
    // 显示推荐号码
    function displayRecommendations(gameType, redNumbers, blueNumbers) {
      const container = document.getElementById('recommended-numbers');
      container.innerHTML = '';
      
      if (redNumbers.length > 0) {
        const redGroup = document.createElement('div');
        redGroup.className = 'number-group';
        redGroup.innerHTML = `
          <div class="group-title">${gameType === 'kuaile8' ? '推荐号码（快乐8需选10个）' : '红球'}</div>
          <div class="numbers">
            ${redNumbers.map(num => `<div class="number red">${num}</div>`).join('')}
          </div>
        `;
        container.appendChild(redGroup);
      }
      
      if (blueNumbers.length > 0) {
        const blueGroup = document.createElement('div');
        blueGroup.className = 'number-group';
        blueGroup.innerHTML = `
          <div class="group-title">蓝球</div>
          <div class="numbers">
            ${blueNumbers.map(num => `<div class="number blue">${num}</div>`).join('')}
          </div>
        `;
        container.appendChild(blueGroup);
      }
      
      document.getElementById('result-container').style.display = 'block';
    }
    
    // 生成解释说明
    function generateExplanation(gameType, ganZhi) {
      const explanation = document.getElementById('explanation');
      let gameName = '';
      let explanationText = '';
      
      switch(gameType) {
        case 'daletou':
          gameName = '大乐透';
          explanationText = `根据${heavenlyStems[ganZhi.gan]}${earthlyBranches[ganZhi.zhi]}年的天干地支和周易八卦理论，结合蒙特卡罗模拟100万次的结果，推荐以下号码。`;
          break;
        case 'shuangseqiu':
          gameName = '双色球';
          explanationText = `基于${heavenlyStems[ganZhi.gan]}${earthlyBranches[ganZhi.zhi]}年的天干地支和周易八卦理论，通过蒙特卡罗方法模拟100万次生成的推荐号码。`;
          break;
        case 'kuaile8':
          gameName = '快乐8';
          explanationText = `根据${heavenlyStems[ganZhi.gan]}${earthlyBranches[ganZhi.zhi]}年的天干地支和周易八卦理论，结合蒙特卡罗模拟结果，生成快乐8推荐号码。快乐8需要从80个号码中选择10个，以下是最可能中奖的10个号码。`;
          break;
      }
      
      explanation.innerHTML = `
        <h4>推荐说明</h4>
        <p>${explanationText}</p>
        <p>本系统结合周易八卦、天干地支理论与蒙特卡罗随机模拟算法，通过大量模拟实验找出出现频率较高的号码组合。请注意，彩票结果完全随机，本推荐仅供娱乐参考。</p>
      `;
    }
    
    // 主函数：生成推荐号码
    function generateRecommendations(gameType) {
      const ganZhi = getGanZhi();
      
      // 显示加载状态
      document.getElementById('recommended-numbers').innerHTML = '<div class="loading">正在模拟计算中，请稍候...</div>';
      document.getElementById('result-container').style.display = 'block';
      
      // 使用setTimeout避免阻塞UI
      setTimeout(() => {
        // 模拟100万次
        const results = simulateNumbers(gameType, 1000000);
        const frequencies = countFrequency(results);
        
        let redNumbers = [];
        let blueNumbers = [];
        
        switch(gameType) {
          case 'daletou':
            redNumbers = getTopNumbers(frequencies.red, 5);
            blueNumbers = getTopNumbers(frequencies.blue, 2);
            break;
          case 'shuangseqiu':
            redNumbers = getTopNumbers(frequencies.red, 6);
            blueNumbers = getTopNumbers(frequencies.blue, 1);
            break;
          case 'kuaile8':
            redNumbers = getTopNumbers(frequencies.red, 10); // 快乐8至少10个号码
            break;
        }
        
        displayRecommendations(gameType, redNumbers, blueNumbers);
        generateExplanation(gameType, ganZhi);
      }, 100);
    }
    
    // 页面加载时初始化
    window.onload = function() {
      getGanZhi();
      
      // 添加按钮事件监听器
      const buttons = document.querySelectorAll('.game-btn');
      buttons.forEach(button => {
        button.addEventListener('click', function() {
          // 移除所有活动状态
          buttons.forEach(btn => btn.classList.remove('active'));
          // 添加当前活动状态
          this.classList.add('active');
          
          // 生成推荐号码
          const gameType = this.getAttribute('data-game');
          generateRecommendations(gameType);
        });
      });
    };
  </script>
</body>
